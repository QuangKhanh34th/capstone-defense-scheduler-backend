spring.application.name=defense-scheduler

# --- K?T N?I SUPABASE (D?ng bi?n m?i tr??ng) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- C?U H?NH KH?C ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- TIMEFOLD SOLVER CONFIGURATION ---
# Solver termination time (default 30 seconds)
timefold.solver.termination.spent-limit=30s
# Enable daemon mode for background solving
timefold.solver.daemon=false
